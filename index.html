<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深圳10天亲子游 · 路线地图</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --bg:#ffffff; --bg2:#f6f7f9; --line:#e6e8ec; --text:#1d2430; --sub:#6b7480; --accent:#1d2430;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

  /* Sidebar */
  #side{width:360px;flex:0 0 360px;height:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
  #head{padding:18px 20px 12px}
  #head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  #head p{margin:4px 0 0;font-size:12.5px;color:var(--sub)}

  #tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none;border-bottom:1px solid var(--line)}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;
    padding:6px 12px;font-size:12.5px;cursor:pointer;text-align:center;line-height:1.25;font-family:inherit}
  .tab small{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
  .tab:hover{background:var(--bg2)}
  .tab.on{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:#fff}
  .tab.on small{color:rgba(255,255,255,.85)}

  #list{flex:1;overflow-y:auto;padding:16px 20px 28px}
  .dayhead{margin-bottom:14px}
  .dayhead .d{font-size:12px;font-weight:600;color:var(--dc);text-transform:uppercase;letter-spacing:.6px}
  .dayhead h2{margin:2px 0 0;font-size:17px;font-weight:700}

  .stops{position:relative;margin:0;padding:0;list-style:none}
  .stop{display:flex;gap:12px;padding:10px 10px;margin:0 -10px;border-radius:10px;cursor:pointer;position:relative}
  .stop:hover{background:var(--bg2)}
  .stop:not(:last-child)::before{content:"";position:absolute;left:25px;top:38px;bottom:-8px;width:2px;background:var(--line)}
  .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--dc);color:#fff;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
  .stop .t{font-size:14.5px;font-weight:600;line-height:1.35}
  .stop .n{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45}

  .daycard{display:flex;gap:12px;align-items:center;padding:12px;margin:0 -12px;border-radius:12px;cursor:pointer}
  .daycard:hover{background:var(--bg2)}
  .daycard .bar{flex:0 0 4px;align-self:stretch;border-radius:4px;background:var(--dc)}
  .daycard .d{font-size:12px;color:var(--sub)}
  .daycard .tt{font-size:14.5px;font-weight:600;margin-top:1px}
  .daycard .c{font-size:12px;color:var(--sub);margin-top:2px}

  #foot{padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--sub);line-height:1.5;background:var(--bg2)}

  .stop .body{flex:1;min-width:0}

  .links{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .lrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .lrow .ln{flex:0 0 100%;font-size:12px;font-weight:600}
  .lrow .la{font-weight:400;color:var(--sub);margin-left:6px}
  .lk,.leaflet-container a.lk{display:inline-block;font:inherit;font-size:11.5px;line-height:1.3;padding:4px 10px;border:1px solid var(--line);
    border-radius:999px;color:var(--text);text-decoration:none;background:var(--bg);cursor:pointer}
  .lk:hover{background:var(--bg2)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(29,36,48,.94);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:6000;max-width:90%;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Map */
  #map{flex:1;height:100%;background:#eef0f3}
  .pin{width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .pin.hotel{background:#1d2430;border-radius:8px;font-size:11px}
  .leaflet-popup-content-wrapper{border-radius:12px}
  .leaflet-popup-content{font-size:13px;line-height:1.5;margin:12px 14px}
  .leaflet-popup-content b{font-size:14px}
  .leaflet-popup-content .pd{color:var(--sub);font-size:11.5px}

  /* Mobile */
  @media (max-width:760px){
    body{flex-direction:column}
    #map{order:1;flex:0 0 46%;height:46%;width:100%}
    #side{order:2;width:100%;flex:1 1 auto;height:54%;border-right:0;border-top:1px solid var(--line)}
    #head{padding:12px 16px 8px}
    #head h1{font-size:16px}
    #tabs{padding:2px 16px 10px}
    #list{padding:12px 16px 20px}
    #foot{display:none}
  }
</style>
</head>

const amapUrl=kw=>`https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}&city=${encodeURIComponent('深圳')}&callnative=1`;
const toastEl=document.getElementById('toast');
let toastT;
function showToast(msg,ms){ toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),ms||3200); }
function copyKw(kw,ev,app,msg){
  app=app||'大众点评';
  if(ev) ev.stopPropagation();
  const done=()=>msg?showToast(msg,6500):showToast(`已复制「${kw}」，请打开${app}粘贴搜索`);
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=kw; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ showToast('搜索词：'+kw); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(kw).then(done,fallback); } else fallback();
}
const withCity=k=>k.includes('深圳')?k:'深圳 '+k;
const isAndroid=()=>/Android/i.test(navigator.userAgent);
function openDp(kw,ev){
  kw=withCity(kw);
  copyKw(kw,ev,'大众点评',`已复制「${kw}」。点评按城市搜索：请先把城市切换为「深圳」（历史访问里有），再粘贴搜索`);
  const enc=encodeURIComponent(kw);
  setTimeout(()=>{
    location.href = isAndroid()
      ? `intent://searchshoplist?keyword=${enc}&cityid=7#Intent;scheme=dianping;package=com.dianping.v1;end`
      : `dianping://searchshoplist?keyword=${enc}&cityid=7`;
  },500);
}
function openAmap(kw,ev){
  kw=withCity(kw);
  if(ev) ev.stopPropagation();
  const enc=encodeURIComponent(kw);
  if(isAndroid()){
    location.href=`intent://poi?sourceApplication=szTrip&keywords=${enc}&dev=0#Intent;scheme=androidamap;package=com.autonavi.minimap;S.browser_fallback_url=${encodeURIComponent(amapUrl(kw))};end`;
  } else {
    location.href=`iosamap://poi?sourceApplication=szTrip&name=${enc}&dev=0`;
    setTimeout(()=>{ if(!document.hidden) window.open(amapUrl(kw),'_blank'); },1200);
  }
}
function openXhs(kw,ev){
  const q=withCity(kw);
  copyKw(q,ev,'小红书');
  const enc=encodeURIComponent(q);

      location.href=`xhsdiscover://search/result?keyword=${enc}`;

}

});
let swapped=false;
osm.on('tileerror',()=>{ if(!swapped){ swapped=true; map.removeLayer(osm); amap.addTo(map); } });
L.control.layers({'OpenStreetMap':osm,'高德地图':amap},null,{position:'topright'}).addTo(map);

const hotelIcon = L.divIcon({
  className:'', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14],
  html:'<div class="pin hotel">H</div>'
});
L.marker([HOTEL.lat,HOTEL.lng],{icon:hotelIcon,zIndexOffset:-100}).addTo(map)
  .bindPopup(`<b>住宿</b><br>${HOTEL.n}${linkChips([HOTEL_LINK])}`);

const layers = {};   // id -> layerGroup
const markers = {};  // id -> [marker]
const allPts = [[HOTEL.lat,HOTEL.lng]];

days.forEach(d=>{
  const group = L.layerGroup();
  markers[d.id] = [];
  d.places.forEach((p,i)=>{
    const icon = L.divIcon({
      className:'', iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13],
      html:`<div class="pin" style="background:${d.color}">${i+1}</div>`
    });
    const m = L.marker([p.lat,p.lng],{icon}).addTo(group)
      .bindPopup(`<b>${p.n}</b><br><span class="pd">Day ${d.id} · ${d.date}</span><br>${p.note||''}${linkChips(LINKS[d.id+'-'+(i+1)])}`);
    markers[d.id].push(m);
    allPts.push([p.lat,p.lng]);
  });
  if(d.places.length>1){
    L.polyline(d.places.map(p=>[p.lat,p.lng]),{color:d.color,weight:3,opacity:.8,dashArray:'2 7',lineCap:'round'}).addTo(group);
  }
  layers[d.id] = group;
});

/* ---------- UI ---------- */
const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');
let current = 'all';

function fitDay(id){
  if(id==='all'){ map.fitBounds(L.latLngBounds(allPts).pad(0.12)); return; }
  const d = days.find(x=>x.id===id);
  const pts = d.places.map(p=>[p.lat,p.lng]);
  if(pts.length===1){ map.setView(pts[0],15); }
  else { map.fitBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:15}); }
}

function renderTabs(){
  tabsEl.innerHTML='';
  const mk=(id,l1,l2,color)=>{
    const b=document.createElement('button');
    b.className='tab'+(current===id?' on':'');
    if(color) b.style.setProperty('--tc',color);
    b.innerHTML=`${l1}<small>${l2}</small>`;
    b.onclick=()=>select(id);
    tabsEl.appendChild(b);
    return b;
  };
  mk('all','全部','10天');
  days.forEach(d=>mk(d.id,`Day ${d.id}`,d.date,d.color));
  const on=tabsEl.querySelector('.on');
  if(on) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

function renderList(){
  if(current==='all'){
    listEl.innerHTML = days.map(d=>`
      <div class="daycard" style="--dc:${d.color}" data-id="${d.id}">
        <div class="bar"></div>
        <div>
          <div class="d">Day ${d.id} · ${d.date}</div>
          <div class="tt">${d.title}</div>
          <div class="c">${d.places.length} 个地点</div>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.daycard').forEach(el=>{
      el.onclick=()=>select(Number(el.dataset.id));
    });
  } else {
    const d = days.find(x=>x.id===current);
    listEl.innerHTML = `
      <div class="dayhead" style="--dc:${d.color}">
        <div class="d">Day ${d.id} · ${d.date}</div>
        <h2>${d.title}</h2>
      </div>
      <ol class="stops" style="--dc:${d.color}">
        ${d.places.map((p,i)=>`
          <li class="stop" data-i="${i}">
            <div class="num">${i+1}</div>
            <div class="body">
              <div class="t">${p.n}</div>
              ${p.note?`<div class="n">${p.note}</div>`:''}
              ${linkChips(LINKS[d.id+'-'+(i+1)])}
            </div>
          </li>`).join('')}
      </ol>`;
    listEl.querySelectorAll('.stop').forEach(el=>{
      el.onclick=()=>{
        const i=Number(el.dataset.i), p=d.places[i];
        map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),15),{duration:.6});
        setTimeout(()=>markers[d.id][i].openPopup(),650);
      };
    });
  }
  listEl.scrollTop=0;
}

function select(id){
  current=id;
  Object.entries(layers).forEach(([k,l])=>{
    const show = id==='all' || Number(k)===id;
    show ? l.addTo(map) : map.removeLayer(l);
  });
  renderTabs(); renderList(); fitDay(id);
}

select('all');
</script>
</body>
</html>
